<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tell the house</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Hanken+Grotesk:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark}
body{margin:0;background:#1C1A17;color:#F4EFE2;font-family:'Hanken Grotesk',sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:420px;margin:0 auto;padding:54px 20px 24px;display:flex;flex-direction:column;gap:16px;min-height:100vh;box-sizing:border-box}
h1{font-family:'Grandstander',cursive;font-weight:800;font-size:32px;line-height:1;letter-spacing:-0.02em;margin:0}
h1 span{color:#8FB544}
.sub{font-size:14px;color:#8A8270;margin-top:6px}
.status{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:15px;border:1px solid #3A362F;background:#26231F;font-size:13px;font-weight:600;color:#C9C2AE}
.dot{width:8px;height:8px;border-radius:50%;background:#8FB544}
textarea{font-family:'Hanken Grotesk',sans-serif;font-size:18px;line-height:1.4;color:#F4EFE2;background:#26231F;border:1px solid #3A362F;border-radius:18px;padding:14px 16px;resize:none;outline:0;width:100%;box-sizing:border-box;height:104px}
textarea:focus{border-color:#8A8270}
textarea::placeholder{color:#8A8270}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;height:34px;padding:0 13px;border-radius:17px;border:1px solid #3A362F;background:#26231F;color:#C9C2AE;white-space:nowrap}
.card{display:flex;flex-direction:column;border-radius:18px;background:#26231F;border:1px solid #3A362F}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.row+.row{border-top:1px solid #3A362F}
.row b{display:block;font-size:15px;font-weight:700}
.row small{display:block;font-size:12.5px;color:#8A8270}
.toggle{width:46px;height:28px;border-radius:14px;border:0;cursor:pointer;position:relative;background:#3A362F;transition:background-color .18s cubic-bezier(.2,.7,.3,1)}
.toggle.on{background:#72962B}
.knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#F4EFE2;transition:transform .18s cubic-bezier(.2,.7,.3,1)}
.toggle.on .knob{transform:translateX(18px)}
.send{font-family:inherit;font-weight:700;font-size:17px;cursor:pointer;height:52px;border-radius:26px;border:0;background:#8FB544;color:#1C1A17}
.send:disabled{opacity:.4}
.k{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9C9482;margin-top:4px}
.item{display:flex;flex-direction:column;gap:4px;padding:0 2px 10px;border-bottom:1px solid #2A2620}
.item .t{font-size:15.5px;line-height:1.35}
.item .s{display:flex;align-items:center;gap:7px;font-size:13px;color:#8A8270}
.item .d{width:7px;height:7px;border-radius:50%}
.token{font-size:13px;color:#8A8270}
.token input{width:100%;box-sizing:border-box;margin-top:6px;font-family:inherit;font-size:14px;color:#F4EFE2;background:#26231F;border:1px solid #3A362F;border-radius:12px;padding:10px 12px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Tell the house<span>.</span></h1>
    <div class="sub">On the TV, out loud, over whatever is on.</div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="st">checking the TV</span></div>
  <div class="token" id="tokbox" hidden>Paste the mini's token once; it stays on this phone.<input id="tok" placeholder="token" autocomplete="off"></div>
  <textarea id="say" placeholder="What should everyone hear?"></textarea>
  <div class="chips">
    <button class="chip" data-q="Dinner's ready, come down!">Dinner's ready</button>
    <button class="chip" data-q="Can someone come down for a minute?">Can someone come down?</button>
    <button class="chip" data-q="Courier is at the door, can someone grab it?">Courier at the door</button>
    <button class="chip" data-q="Lights out in 10 minutes.">Lights out in 10</button>
  </div>
  <div class="card">
    <div class="row"><div><b>Say it out loud</b><small>A chime, then the voice reads it</small></div><button class="toggle on" id="voice" role="switch" aria-checked="true" aria-label="Say it out loud"><span class="knob"></span></button></div>
    <div class="row"><div><b>Wake the TV if it's asleep</b><small>The mini turns it on first</small></div><button class="toggle on" id="wake" role="switch" aria-checked="true" aria-label="Wake the TV if it's asleep"><span class="knob"></span></button></div>
  </div>
  <button class="send" id="send" disabled>Announce</button>
  <div class="k">Earlier</div>
  <div id="list"></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const DOT = { sent: '#8A8270', shown: '#FFC92F', seen: '#8FB544', failed: '#D6694F' };
let token = localStorage.getItem('mkTodayToken') || '';
if (!token) { $('#tokbox').hidden = false; }
$('#tok').addEventListener('change', (e) => { token = e.target.value.trim(); localStorage.setItem('mkTodayToken', token); $('#tokbox').hidden = !!token; refresh(); });
const H = () => ({ 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' });
const say = $('#say'), send = $('#send');
say.addEventListener('input', () => { send.disabled = !say.value.trim(); });
document.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => { say.value = c.dataset.q; send.disabled = false; }));
['voice', 'wake'].forEach((id) => $('#' + id).addEventListener('click', (e) => { const b = e.currentTarget; b.classList.toggle('on'); b.setAttribute('aria-checked', b.classList.contains('on')); }));
function when(ts) { const d = new Date(ts * 1000); let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0'); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + m + ' ' + ap; }
function line(it) {
  if (it.status === 'seen') return 'Seen ' + when(it.seen_at);
  if (it.status === 'shown') return 'On the TV now' + (it.voice ? ', saying it out loud' : '');
  if (it.status === 'failed') return it.error || 'Not shown';
  return 'Sending to the TV';
}
async function refresh() {
  if (!token) return;
  try {
    const r = await fetch('/announce/list', { headers: H() });
    if (r.status === 401) { $('#tokbox').hidden = false; $('#st').textContent = 'token needed'; $('#dot').style.background = '#D6694F'; return; }
    const d = await r.json();
    $('#st').textContent = d.tv.awake ? ('TV on' + (d.tv.input === 'ps5' ? ' · PS5 playing' : d.tv.input === 'home' ? ' · home screen' : '')) : 'TV asleep, the mini will wake it';
    $('#dot').style.background = d.tv.awake ? '#8FB544' : '#8A8270';
    $('#list').innerHTML = d.items.slice(0, 6).map((it) => '<div class="item"><div class="t"></div><div class="s"><span class="d" style="background:' + (DOT[it.status] || '#8A8270') + '"></span><span></span></div></div>').join('');
    [...document.querySelectorAll('.item')].forEach((el, i) => { el.querySelector('.t').textContent = d.items[i].text; el.querySelector('.s span:last-child').textContent = line(d.items[i]); });
  } catch (e) { $('#st').textContent = 'mini not reachable'; $('#dot').style.background = '#D6694F'; }
}
send.addEventListener('click', async () => {
  const text = say.value.trim(); if (!text) return;
  send.disabled = true;
  try {
    const r = await fetch('/announce', { method: 'POST', headers: H(), body: JSON.stringify({ text, from: 'Amba', voice: $('#voice').classList.contains('on'), wake: $('#wake').classList.contains('on') }) });
    if (r.ok) say.value = '';
  } catch (e) {}
  refresh();
});
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
